services:
  db:
    network_mode: host
    networks: !reset []
    ports: []

  backend:
    network_mode: host
    networks: !reset []
    environment:
      DB_HOST: 127.0.0.1
    ports: []

  frontend:
    network_mode: host
    networks: !reset []
    ports: []

  proxy:
    network_mode: host
    networks: !reset []
    volumes:
      - ./proxy/nginx.codespaces.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
    ports: []

networks:
  edge:
  data: